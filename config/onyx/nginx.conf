# Onyx Nginx reverse proxy — routes frontend and API traffic.
# Simplified for the workbench stack (no SSL, internal-only).

upstream onyx-api {
    server onyx-api-server:8080;
}

upstream onyx-web {
    server onyx-web-server:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # API requests → backend
    location /api {
        proxy_pass http://onyx-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://onyx-web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
