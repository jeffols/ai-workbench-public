name: composecraft
services:
  saas:
    image: composecraft/composecraft:latest
    environment:
      - CORE_ONLY=true
      - URL=http://composecraft.localhost
      - SECRET_KEY=changeme
      - MONGODB_URI=mongodb://dev:dev@db
    depends_on:
      - db
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.composecraft.rule: Host(`composecraft.localhost`)
      traefik.http.services.composecraft.loadbalancer.server.port: "3000"
  db:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev
      - MONGO_INITDB_ROOT_PASSWORD=dev
    networks:
      - internal
    volumes:
      - mongo_data:/data/db
networks:
  internal:
    driver: bridge
  proxy:
    external: true
volumes:
  mongo_data:
